name: APK Derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android proje dosyalarını oluştur
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=android --project-name dijital_cerceve --org com.gozde .
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml

      - name: Tüm eklentilerde compileSdk 36 kullan
        run: |
          cat > /tmp/fix.kts <<'EOT'
          subprojects {
              afterEvaluate {
                  val ext = extensions.findByName("android")
                  if (ext != null) {
                      ext.javaClass.getMethod("compileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 36)
                  }
              }
          }
          EOT
          cat > /tmp/fix.groovy <<'EOT'
          subprojects {
              afterEvaluate { p ->
                  if (p.hasProperty('android')) {
                      p.android.compileSdkVersion 36
                  }
              }
          }
          EOT
          if [ -f android/build.gradle.kts ]; then
            cat /tmp/fix.kts android/build.gradle.kts > /tmp/new.kts
            cp /tmp/new.kts android/build.gradle.kts
          else
            cat /tmp/fix.groovy android/build.gradle > /tmp/new.gradle
            cp /tmp/new.gradle android/build.gradle
          fi

      - name: Android 7 uyumu, izinler ve ekran açık kalsın
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle || true
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          i = s.index('<manifest')
          j = s.index('>', i) + 1
          izin = (
              '\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>'
              '\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>'
          )
          s = s[:j] + izin + s[j:]
          s = s.replace('<application', '<application android:requestLegacyExternalStorage="true"', 1)
          open(p, 'w', encoding='utf-8').write(s)
          import glob
          f = glob.glob('android/app/src/main/kotlin/**/MainActivity.kt', recursive=True)[0]
          pkg = open(f, encoding='utf-8').readline().strip()
          open(f, 'w', encoding='utf-8').write(
              pkg + '\n\n'
              'import android.os.Bundle\n'
              'import android.view.WindowManager\n'
              'import io.flutter.embedding.android.FlutterActivity\n\n'
              'class MainActivity : FlutterActivity() {\n'
              '    override fun onCreate(savedInstanceState: Bundle?) {\n'
              '        super.onCreate(savedInstanceState)\n'
              '        window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)\n'
              '    }\n'
              '}\n')
          PY

      - run: flutter pub get

      - run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: dijital-cerceve-apk
          path: build/app/outputs/flutter-apk/app-release.apk
